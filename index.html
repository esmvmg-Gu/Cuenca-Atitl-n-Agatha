<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Río Abajo — Tormenta Ágata, Atitlán</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
<style>
  :root{
    --bg:#0e1a16; --panel:#182c22ee; --panel-2:#1f3a2bee; --line:#2f4d3a;
    --ink:#eee6d3; --muted:#93ab99; --forest:#4c9a6a; --amber:#d8a84e; --blue:#5b9bd6; --danger:#c1443b; --good:#6fbf8b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);font-family:'Inter',sans-serif;color:var(--ink);overflow:hidden;}
  .wrap{max-width:1000px;margin:0 auto;padding:20px 16px 50px;overflow-y:auto;height:100%;}
  h1{font-family:'Fraunces',serif;font-weight:700;font-size:clamp(22px,5vw,32px);margin:0 0 4px;letter-spacing:-.01em;}
  h1 em{font-style:italic;color:var(--forest);}
  h2{font-family:'Fraunces',serif;font-size:19px;margin:0 0 4px;}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .eyebrow::before{content:"";width:16px;height:1px;background:var(--amber);}
  .sub{color:var(--muted);font-size:13.5px;line-height:1.55;max-width:640px;}

  .hist-box{margin-top:14px;background:var(--panel-2);border-left:3px solid var(--danger);border-radius:0 10px 10px 0;padding:12px 15px;font-size:12.5px;color:#e5d0cd;line-height:1.6;}
  .hist-box b{color:var(--ink);}

  /* TIMELINE */
  .timeline-section{margin-top:22px;}
  .timeline-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .timeline-track{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;}
  .tl-step{
    flex:0 0 168px;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;transition:.15s;
  }
  .tl-step:hover{border-color:var(--blue);}
  .tl-step.active{border-color:var(--amber);background:var(--panel-2);box-shadow:0 0 0 1px var(--amber) inset;}
  .tl-step .date{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--amber);text-transform:uppercase;letter-spacing:.05em;}
  .tl-step .head{font-weight:700;font-size:12.5px;margin-top:4px;}
  .tl-detail{margin-top:12px;background:var(--panel-2);border-radius:10px;padding:13px 15px;font-size:12.5px;line-height:1.6;color:#dce7dc;min-height:44px;}
  .mini-btn{background:var(--panel-2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 12px;font-size:11.5px;font-weight:600;cursor:pointer;}
  .mini-btn:hover{border-color:var(--forest);}

  .cta-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px;}
  .start-btn{
    background:var(--forest); color:#0c1814; border:none; border-radius:11px;
    padding:14px 24px; font-weight:700; font-size:14px; cursor:pointer; transition:.15s;
  }
  .start-btn.secondary{background:var(--panel-2); color:var(--ink); border:1.5px solid var(--danger);}
  .start-btn:hover{filter:brightness(1.08);}

  /* MAP SCREEN */
  #map{position:absolute;inset:0;}
  #rainCanvas{position:absolute;inset:0;z-index:3;pointer-events:none;}
  #weatherOverlay{position:absolute;inset:0;z-index:2;pointer-events:none;background:rgba(10,16,12,0);transition:background 1s ease;}
  #flashOverlay{position:absolute;inset:0;z-index:2;pointer-events:none;background:rgba(255,255,255,0);}
  .topbar{position:absolute;top:0;left:0;right:0;z-index:6;background:linear-gradient(to bottom, rgba(8,14,11,.92), rgba(8,14,11,0));padding:12px 16px 40px;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-start;}
  .topbar *{pointer-events:auto;}
  .place-tag{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--amber);text-transform:uppercase;letter-spacing:.08em;}
  .mute-btn{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:7px 12px;font-size:12px;cursor:pointer;color:var(--ink);}
  .side-panel{position:absolute;top:70px;right:14px;z-index:6;width:250px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;backdrop-filter:blur(6px);}
  .risk-item{margin-bottom:10px;}
  .risk-top{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-bottom:4px;}
  .risk-val{font-weight:700;}
  .risk-track{height:9px;background:#0e1c15;border-radius:5px;overflow:hidden;}
  .risk-fill{height:100%;border-radius:5px;transition:width .6s ease, background .6s ease;}
  .narrative-box{font-size:12px;line-height:1.55;color:#dce7dc;margin-top:10px;border-top:1px solid var(--line);padding-top:10px;}
  .impact-row{display:flex;gap:8px;margin-top:10px;border-top:1px solid var(--line);padding-top:10px;}
  .impact-item{flex:1;background:var(--panel-2);border-radius:9px;padding:8px;text-align:center;}
  .impact-item .n{font-family:'JetBrains Mono',monospace;font-size:17px;font-weight:700;color:var(--amber);}
  .impact-item .l{font-size:9.5px;color:var(--muted);margin-top:2px;}
  .impact-note{font-size:9.5px;color:var(--muted);margin-top:6px;line-height:1.4;}

  .bottom-panel{position:absolute;bottom:16px;left:16px;z-index:6;width:300px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;backdrop-filter:blur(6px);}
  .lbl{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px;}
  .rain-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  .rain-btn{background:var(--panel-2);border:1.5px solid var(--line);border-radius:9px;padding:9px 6px;text-align:center;cursor:pointer;font-size:12px;font-weight:700;transition:.15s;}
  .rain-btn:hover{border-color:var(--blue);}
  .rain-btn.active{border-color:var(--blue);background:#233a4a;box-shadow:0 0 0 1px var(--blue) inset;}
  .rain-btn .mm{display:block;font-size:14px;}
  .rain-btn .tag{display:block;font-size:9.5px;font-weight:500;color:var(--muted);margin-top:1px;}
  .place-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .place-btn{background:var(--panel-2);border:1.5px solid var(--line);border-radius:10px;padding:10px 8px;text-align:center;cursor:pointer;font-weight:700;font-size:12.5px;}
  .place-btn.active{border-color:var(--forest);background:#274733;}
  .back-btn{position:fixed;top:10px;right:10px;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:6px 12px;cursor:pointer;z-index:9;}
  .attrib{position:absolute;bottom:6px;right:10px;z-index:4;font-size:9px;color:#7d9285;font-family:'JetBrains Mono',monospace;background:rgba(10,18,14,.6);padding:2px 7px;border-radius:5px;}
  .maplibregl-ctrl-attrib{display:none;}
  @media (max-width:760px){ .side-panel{width:190px;top:auto;bottom:190px;right:10px;} .bottom-panel{width:calc(100% - 28px);} }

  /* MISSION */
  .mission-topbar{position:absolute;top:0;left:0;right:0;z-index:6;background:linear-gradient(to bottom, rgba(8,14,11,.92), rgba(8,14,11,0));padding:12px 16px 40px;pointer-events:none;display:flex;justify-content:space-between;}
  .mission-topbar *{pointer-events:auto;}
  .mission-clock{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:700;color:var(--amber);}
  .evac-panel{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);z-index:7;text-align:center;}
  .evac-btn{
    background:var(--danger); color:#fff; border:none; border-radius:50px; padding:20px 40px;
    font-weight:800; font-size:17px; cursor:pointer; box-shadow:0 6px 24px rgba(193,68,59,.5); transition:.15s; letter-spacing:.02em;
  }
  .evac-btn:hover{transform:scale(1.04);}
  .evac-btn:disabled{background:#4a3a38;box-shadow:none;cursor:not-allowed;}
  .mission-hint{margin-top:10px;font-size:12px;color:var(--muted);font-family:'JetBrains Mono',monospace;}
  .result-overlay{
    position:absolute;inset:0;z-index:20;background:rgba(8,14,11,.92);display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .result-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:30px;max-width:440px;width:100%;text-align:center;}
  .result-badge{display:inline-block;padding:6px 16px;border-radius:20px;font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:14px;font-weight:700;}
  .result-num{font-family:'JetBrains Mono',monospace;font-size:38px;font-weight:800;margin:10px 0 4px;}
  .result-sub{font-size:12.5px;color:var(--muted);margin-bottom:16px;}
  .result-text{font-size:13.5px;line-height:1.6;color:#dce7dc;text-align:left;background:var(--panel-2);border-radius:10px;padding:14px;margin-bottom:18px;}
  /* MODALES: fuentes / leyenda / quiz */
  .modal-overlay{position:fixed;inset:0;background:rgba(6,10,8,.78);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:40;}
  .modal-box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;max-width:520px;width:100%;max-height:82vh;overflow-y:auto;}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .modal-head h2{font-family:'Fraunces',serif;font-size:19px;margin:0;}
  .source-list{margin:0;padding-left:18px;font-size:12.5px;line-height:1.6;color:#dce7dc;}
  .source-list li{margin-bottom:9px;}
  .legend-row{display:flex;align-items:center;gap:10px;font-size:13px;color:#dce7dc;padding:7px 0;border-bottom:1px solid var(--line);}
  .legend-swatch{width:22px;height:14px;border-radius:3px;flex:none;}
  .legend-dot{width:12px;height:12px;border-radius:50%;flex:none;}
  .quiz-q{margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--line);}
  .quiz-prompt{font-size:13.5px;font-weight:600;margin-bottom:8px;}
  .quiz-opts{display:flex;flex-direction:column;gap:6px;}
  .quiz-opt{background:var(--panel-2);border:1.5px solid var(--line);border-radius:8px;padding:8px 12px;font-size:12.5px;cursor:pointer;}
  .quiz-opt:hover{border-color:var(--forest);}
  .quiz-opt.chosen{border-color:var(--blue);background:var(--panel-3);}
  .quiz-fb{margin-top:8px;font-size:12px;line-height:1.5;padding:8px 10px;border-radius:8px;}
  .quiz-fb.ok{background:#1d3a2a;color:var(--good);}
  .quiz-fb.bad{background:#3a2320;color:#f0a89f;}
</style>
</head>
<body>
<div id="app" class="wrap"></div>

<script>
/* =========================================================
   CONFIG / DATOS
========================================================= */
let localState = null, map = null, demoPlaying = false, soundOn = true, bestMissionScore = null;

const PLACES = {
  panajachel: {
    label:"Panajachel", short:"Panajachel",
    center:[-91.1570, 14.7370], zoom:14.6, pitch:62, bearing:25,
    floodCenter:[-91.15797, 14.73396], // desembocadura real del Río Panajachel (fuente: capa hidrográfica IGN/MAGA)
    vuln:1.15, landslideVuln:1.25,
    river:"río San Francisco (también llamado río Panajachel)",
    // población: 7,183 hab. — dato OFICIAL (INE, censo 2002) citado textualmente en el propio
    // estudio hidrológico como "la localidad de Panajachel, que es la principalmente amenazada
    // por las avenidas del río San Francisco". Es más antiguo que el censo 2018 (municipio: 15,077
    // hab., INE 2018) pero es el único que aísla específicamente la población en riesgo por el río,
    // en vez de todo el municipio (que incluye aldeas alejadas del cauce). Viviendas = personas /
    // tamaño medio de hogar (~5, según estudios locales de la región), no es un conteo censal directo.
    people:7183, houses:1437,
    popSource:"INE, censo 2002 — población de la localidad de Panajachel amenazada por el río San Francisco (citada en el estudio hidrológico 2012)"
  },
  sanmarcos: {
    label:"San Marcos La Laguna", short:"San Marcos",
    center:[-91.2825, 14.6975], zoom:15.0, pitch:62, bearing:-15,
    floodCenter:[-91.2825, 14.6975],
    vuln:0.9, landslideVuln:0.85,
    river:"las quebradas que bajan hacia la orilla del lago",
    // población: 2,944 hab. — proyección INE 2021 con base en el censo 2018 (la cifra de "censo
    // 2018" exacta que encontré en fuentes secundarias variaba entre 2,836 y 2,944 según la
    // fuente; uso la que tiene mejor trazabilidad a una fuente primaria del INE). A diferencia
    // de Panajachel, casi toda la población de este municipio pequeño (12km²) vive en el propio
    // pueblo, así que el total municipal es una aproximación razonable a la población del pueblo.
    people:2944, houses:589,
    popSource:"INE, proyección de población 2021 con base en el censo 2018 (XII Censo Nacional de Población y VII de Vivienda) — población total del municipio"
  }
};

/* Eventos históricos reales que golpearon el río San Francisco, con la lluvia máxima diaria
   medida en la estación Santa María El Tablón (serie 1995-2011) y su período de retorno (T),
   tal como los calcula el propio estudio con la distribución de Gumbel. Para las depresiones
   E-11 y 12-E el estudio no publica la lluvia en mm directamente, solo el período de retorno
   (T=4 y T=3 años) — esos dos valores están recalculados aquí con la misma fórmula y los
   mismos parámetros de Gumbel del estudio (α=0.02520741, β=73.243), marcados como "estimado".
   internalMm es la posición equivalente en la escala de lluvia del juego (0-100), para que la
   franja de inundación y los medidores de riesgo reaccionen de forma proporcional. */
const HISTORICAL_EVENTS = [
  { key:'12e', name:'Depresión 12-E', year:'2012', realMm:'≈109mm (estimado)', T:'T≈3 años', internalMm:24,
    desc:'El evento más "común" de los cinco — un tipo de lluvia que, estadísticamente, se espera cada pocos años.' },
  { key:'e11', name:'Depresión E-11', year:'2010', realMm:'≈123mm (estimado)', T:'T≈4 años', internalMm:28,
    desc:'Ocurrió apenas meses después de Ágata, en la misma temporada de huracanes de 2010.' },
  { key:'mitch', name:'Huracán Mitch', year:'1998', realMm:'146.8mm', T:'—', internalMm:42,
    desc:'El máximo de lluvia medido ese año en la estación cercana a Panajachel.' },
  { key:'stan', name:'Tormenta Stan', year:'2005', realMm:'166.7mm', T:'T≈11 años', internalMm:52,
    desc:'Destruyó por primera vez el puente La Amistad y la planta de tratamiento de aguas residuales, a las 6am.' },
  { key:'agatha', name:'Tormenta Ágata', year:'2010', realMm:'215.8mm', T:'T≈37 años', internalMm:70,
    desc:'El evento más extremo de toda la serie 1995-2011 — el escenario de referencia de este simulador.' },
];

const TIMELINE = [
  { date:"27 mayo 2010", head:"Erupción del Pacaya", text:"El volcán de Pacaya, cerca de la capital, entra en erupción y obliga a evacuar a unas 2,000 personas por la caída de ceniza — la región ya estaba en alerta antes de que llegara la tormenta." },
  { date:"28-30 mayo 2010", head:"Casi 72 horas de lluvia continua", text:"La tormenta tropical Ágata descarga sobre Guatemala durante casi tres días seguidos. En la estación Santa María El Tablón (la más cercana a Panajachel) se registran 215.8mm — el máximo anual más alto de toda la serie 1995-2011, con un período de retorno estimado de apenas ~37 años: un evento fuerte, pero lejos de ser estadísticamente 'extraordinario'." },
  { date:"29-30 mayo, madrugada", head:"El río San Francisco se desborda", text:"El agua baja con tanta velocidad que no solo inunda: erosiona y socava los márgenes del cauce. Ágata destruye viviendas y vuelve a romper el puente de La Amistad — el mismo que ya había sido arrasado por la tormenta Stan en 2005, cuando también se destruyó la planta de tratamiento de aguas residuales del sector." },
  { date:"Meses después", head:"~2 metros de sedimento", text:"Tras el paso de Ágata se midieron cerca de 2 metros de sedimento acumulado en el abanico aluvial donde está construido Panajachel — el mismo proceso que, a lo largo de siglos, formó el terreno sobre el que se asienta el pueblo." },
  { date:"Balance final", head:"174 muertos, 330,000 desplazados", text:"En todo Guatemala, Ágata dejó 174 personas fallecidas y cerca de 330,000 desplazadas. No fue un hecho aislado: Mitch (1998), Stan (2005) y las depresiones E-11 (2010) y 12-E (2012) golpearon el mismo río en poco más de una década." },
];

/* Puntos de riesgo de deslizamiento: a diferencia de los ríos (datos reales del
   IGN/MAGA) y del estudio hidrológico, esto NO sale de un mapa geológico de
   susceptibilidad oficial — son posiciones ilustrativas sobre laderas con
   pendiente pronunciada cerca del pueblo, solo para representar el concepto. */
const LANDSLIDE_POINTS_PANAJACHEL = [
  { coord:[-91.1622,14.7548], label:"Ladera deforestada — riesgo de deslizamiento" },
  { coord:[-91.1518,14.7545], label:"Corte de camino — riesgo de deslizamiento" },
];
/* Puntos críticos reales del río San Francisco (posición aproximada sobre el cauce
   modelado, no coordenadas topográficas exactas — el estudio los ubica por cadenamiento,
   ej. K1+396, no por lat/lon). Fuente: Geólogos del Mundo / CONRED / AECID (2012),
   "Estudio hidrológico-hidráulico de avenida en el río San Francisco (Panajachel)". */
const RIVER_LANDMARKS_PANAJACHEL = [
  { coord:[-91.15667,14.73592], label:"Puente La Amistad — solo 46m de paso (vs. ~100m aguas arriba). Ágata lo destruyó; en avenidas de 100 años el agua llega a la plataforma." },
  { coord:[-91.15504,14.73822], label:"Tramo de mayor invasión de viviendas sobre el cauce — aquí se concentran los desbordamientos en crecidas de 25 y 100 años." },
];
/* Caudal de avenida en la desembocadura, según el estudio real (m³/s) para T=5/25/100 años,
   más el método japonés (UNIRIOS) para T=100 como referencia alta. Interpolación lineal
   entre estos puntos ancla — es una referencia ilustrativa, no un cálculo hidrológico nuevo. */
/* Ríos y quebradas reales de la cuenca del lago Atitlán, tomados de la capa
   hidrográfica oficial (IGN/MAGA Guatemala), reproyectada de GTM a WGS84 y

const CAUDAL_ANCHORS = [ {mm:0,q:0}, {mm:30,q:443}, {mm:50,q:753}, {mm:70,q:950}, {mm:100,q:1380} ];
function estimateCaudal(mm){
  for(let i=0;i<CAUDAL_ANCHORS.length-1;i++){
    const a=CAUDAL_ANCHORS[i], b=CAUDAL_ANCHORS[i+1];
    if(mm>=a.mm && mm<=b.mm){
      const t=(mm-a.mm)/(b.mm-a.mm);
      return Math.round(a.q + t*(b.q-a.q));
    }
  }
  return mm<=0 ? 0 : CAUDAL_ANCHORS[CAUDAL_ANCHORS.length-1].q;
}

function defaultState(){ return { rainMm:0, place:'panajachel', wallsBuilt:false }; }

/* =========================================================
   SONIDO (sintetizado, sin archivos externos)
========================================================= */
let audioCtx=null, rainGain=null, alarmOsc=null, alarmGain=null, alarmInterval=null, thunderTimer=null;
function initAudio(){
  if(audioCtx || !soundOn) return;
  try{
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const bufferSize = 2*audioCtx.sampleRate;
    const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const out = noiseBuffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++) out[i] = Math.random()*2-1;
    const whiteNoise = audioCtx.createBufferSource();
    whiteNoise.buffer = noiseBuffer; whiteNoise.loop = true;
    const filter = audioCtx.createBiquadFilter(); filter.type='bandpass'; filter.frequency.value=1200; filter.Q.value=0.6;
    rainGain = audioCtx.createGain(); rainGain.gain.value = 0;
    whiteNoise.connect(filter); filter.connect(rainGain); rainGain.connect(audioCtx.destination);
    whiteNoise.start();
    thunderTimer = setInterval(()=>{
      const mm = localState ? localState.rainMm : 0;
      if(mm>35 && Math.random() < (mm/100)*0.22) playThunder();
    }, 2600);
  }catch(e){ console.error('audio init failed', e); }
}
function setRainVolume(mm){
  if(!rainGain || !audioCtx) return;
  const v = soundOn ? Math.min(0.32, mm/100*0.32) : 0;
  rainGain.gain.linearRampToValueAtTime(v, audioCtx.currentTime+0.7);
}
function playThunder(){
  if(!audioCtx || !soundOn) return;
  const dur=1.3;
  const buffer = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate*dur), audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<data.length;i++) data[i] = (Math.random()*2-1) * Math.pow(1-i/data.length, 2.2);
  const src = audioCtx.createBufferSource(); src.buffer=buffer;
  const filter = audioCtx.createBiquadFilter(); filter.type='lowpass'; filter.frequency.value=140;
  const gain = audioCtx.createGain(); gain.gain.value=0.55;
  src.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
  src.start();
  flashScreen();
}
function flashScreen(){
  const el = document.getElementById('flashOverlay');
  if(!el) return;
  el.style.transition='none'; el.style.background='rgba(255,255,255,0.18)';
  requestAnimationFrame(()=>{ el.style.transition='background 0.6s ease'; el.style.background='rgba(255,255,255,0)'; });
}
function startAlarm(){
  if(!audioCtx || !soundOn || alarmInterval) return;
  alarmOsc = audioCtx.createOscillator(); alarmOsc.type='sine'; alarmOsc.frequency.value=760;
  alarmGain = audioCtx.createGain(); alarmGain.gain.value=0;
  alarmOsc.connect(alarmGain); alarmGain.connect(audioCtx.destination);
  alarmOsc.start();
  let up=true;
  alarmInterval = setInterval(()=>{
    if(!alarmGain) return;
    alarmGain.gain.linearRampToValueAtTime(up?0.16:0, audioCtx.currentTime+0.35);
    up=!up;
  }, 420);
}
function stopAlarm(){
  if(alarmInterval){ clearInterval(alarmInterval); alarmInterval=null; }
  if(alarmGain && audioCtx) alarmGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime+0.3);
  setTimeout(()=>{ if(alarmOsc){ try{alarmOsc.stop();}catch(e){} alarmOsc=null; } }, 400);
}
function toggleSound(){
  soundOn = !soundOn;
  if(soundOn) initAudio(); else { setRainVolume(0); stopAlarm(); }
  const b = document.getElementById('muteBtn');
  if(b) b.textContent = soundOn ? '🔊 Sonido' : '🔇 Silencio';
}

/* =========================================================
   MODELO DE RIESGO E IMPACTO (ilustrativo)
========================================================= */
function computeRisk(s){
  const place = PLACES[s.place];
  let floodRisk = Math.max(0, Math.min(100, (s.rainMm/70*100) * place.vuln));
  // Muros de encauzamiento (recomendación real del estudio, escenario 2): reducen el desbordamiento
  // dentro de su tramo protegido, pero NO evitan deslizamientos ni la erosión de las laderas.
  if(s.wallsBuilt && s.place==='panajachel') floodRisk *= 0.6;
  floodRisk = Math.max(0, Math.min(100, floodRisk));
  const landslideRisk = Math.max(0, Math.min(100, (s.rainMm/50*100) * (place.landslideVuln||1)));
  return { floodRisk, landslideRisk };
}
/* Velocidad media del agua — el estudio real insiste en que es el peligro principal
   (no solo la altura). Anclado a "para T=100 años, velocidad media entre 4 y 7 m/s
   en las secciones, cerca de 8 m/s en los puentes Ubico y La Amistad". Interpolación
   ilustrativa entre 0 y esos valores reales, solo para Panajachel. */
const VELOCITY_ANCHORS = [ {mm:0,v:0}, {mm:30,v:2.6}, {mm:50,v:4.0}, {mm:70,v:5.5}, {mm:100,v:7.8} ];
function estimateVelocity(mm){
  for(let i=0;i<VELOCITY_ANCHORS.length-1;i++){
    const a=VELOCITY_ANCHORS[i], b=VELOCITY_ANCHORS[i+1];
    if(mm>=a.mm && mm<=b.mm){ const t=(mm-a.mm)/(b.mm-a.mm); return +(a.v + t*(b.v-a.v)).toFixed(1); }
  }
  return mm<=0 ? 0 : VELOCITY_ANCHORS[VELOCITY_ANCHORS.length-1].v;
}
function computeImpact(risk, place){
  const ratio = Math.min(1, risk/100) * 0.82;
  return { houses: Math.round(place.houses*ratio), people: Math.round(place.people*ratio) };
}
function riskColor(v){ if(v>=65) return "var(--danger)"; if(v>=35) return "var(--amber)"; return "var(--good)"; }
function rainLabel(mm){
  if(mm<=0) return "sin lluvia";
  if(mm<20) return "ligera";
  if(mm<35) return "moderada";
  if(mm<45) return "fuerte";
  if(mm<60) return "muy fuerte";
  if(mm<85) return "torrencial";
  return "tormenta extrema";
}
function narrativeText(s, r){
  const place = PLACES[s.place];
  if(s.rainMm === 0) return `Sin lluvia registrada en ${place.short}. En mayo de 2010, la tormenta Ágata trajo en pocos días una cantidad de lluvia muy superior a esto sobre toda la cuenca del lago Atitlán.`;
  const wallsNote = (s.place==='panajachel' && s.wallsBuilt) ? " Los muros de encauzamiento (la medida que recomienda el estudio real, diseñados para la avenida de 100 años) contienen bastante mejor el río — pero no hacen nada contra los deslizamientos de ladera." : "";
  const slideIsDominant = r.landslideRisk > 65 && r.landslideRisk >= r.floodRisk;
  if(slideIsDominant) return `Con ${s.rainMm}mm en 24 horas, el mayor peligro en ${place.short} ya no es solo el río: las laderas empapadas alrededor del pueblo pueden ceder en cualquier momento. Los deslizamientos suelen adelantarse a la crecida del río.${wallsNote}`;
  if(s.place==='panajachel' && r.floodRisk > 65) return `Con ${s.rainMm}mm en 24 horas, ${place.short} está en el escenario de la tormenta Ágata (2010). El estudio hidrológico real de este río advierte algo clave: el peligro principal no es solo que el agua suba, sino su velocidad erosiva — capaz de socavar los márgenes y destruir edificaciones enteras. El puente La Amistad, con apenas 46m de paso frente a los ~100m de aguas arriba, es el punto más crítico: ahí el agua se acelera y puede llegar a la plataforma del puente.${wallsNote}`;
  if(r.floodRisk > 65) return `Con ${s.rainMm}mm en 24 horas, ${place.short} está en el escenario de la tormenta Ágata (2010): el agua baja con fuerza por ${place.river} y se desborda sobre las zonas bajas cercanas al lago, mientras el riesgo de deslizamientos en las laderas también es alto.`;
  if(s.place==='panajachel' && r.floodRisk > 35) return `Con ${s.rainMm}mm, el caudal sube con fuerza. El cauce del río San Francisco, colmatado de sedimentos desde Ágata, ya no tiene capacidad para crecidas frecuentes: el estudio real muestra que empieza a desbordarse incluso en escenarios de apenas 25 años de período de retorno, sobre todo en el tramo donde más viviendas invadieron el cauce.${wallsNote}`;
  if(r.floodRisk > 35 || r.landslideRisk > 35) return `Con ${s.rainMm}mm, el caudal sube con fuerza y el suelo de las laderas empieza a saturarse. ${place.short} está construido en gran parte sobre un abanico aluvial —el terreno que el propio río formó con sus crecidas— por eso es tan vulnerable tanto a inundaciones como a deslizamientos.`;
  return `Con ${s.rainMm}mm el sistema todavía absorbe el agua sin desbordarse, pero ${place.short} está clasificado como zona de riesgo por crecidas repentinas y deslizamientos.`;
}

/* =========================================================
   FRANJA DE INUNDACIÓN SOBRE LA ORILLA REAL DEL RÍO
   (buffer a lo largo del trazado real del cauce, no un círculo —
   el ancho crece con la lluvia. Ilustrativo: no es un cálculo
   hidráulico de la lámina de agua real, sino una franja proporcional
   centrada en el cauce real tomado de la capa hidrográfica IGN/MAGA)
========================================================= */
/* Línea única y continua del cauce principal (encadenada a partir de los 38 tramos,

function floodLineWidthPx(s){

  map.setPaintProperty('floodLineLayer', 'line-opacity', w>0 ? 0.8 : 0);
}

/* =========================================================
   RED DE QUEBRADAS + GOTAS SOBRE EL TERRENO (inspirado en el
   modelo de escorrentía: partículas que convergen hacia el cauce)
========================================================= */
let drainageActive = false, rainDotsTimer = null, flowTimer = null, flowParticles = [], riverLineForFlow = null, riverLengthKm = 0, landslideMarkers = [], riverLandmarkMarkers = [];

/* ---- Ríos reales (dataset oficial), siempre visibles en el mapa ---- */
function riversToGeoJSON(arr){
  return { type:'FeatureCollection', features: (arr||[]).map(f=>({
    type:'Feature', properties:{ p:f.p, n:f.n||'' }, geometry:{ type:'LineString', coordinates:f.c }
  })) };
}
function addRealRivers(placeKey){
  if(!map) return;
  const arr = placeKey==='panajachel' ? RIVERS_PANAJACHEL : (placeKey==='sanmarcos' ? RIVERS_SANMARCOS : []);
  const data = riversToGeoJSON(arr);
  if(map.getSource('realRivers')){
    map.getSource('realRivers').setData(data);
    return;
  }
  map.addSource('realRivers', { type:'geojson', data });
  map.addLayer({ id:'realRiversIntermittent', type:'line', source:'realRivers',
    filter:['==',['get','p'],0],
    layout:{ 'line-cap':'round', 'line-join':'round' },
    paint:{ 'line-color':'#4fa3c4', 'line-width':1, 'line-opacity':0.45, 'line-dasharray':[2,2] } });
  map.addLayer({ id:'realRiversPerennial', type:'line', source:'realRivers',
    filter:['==',['get','p'],1],
    layout:{ 'line-cap':'round', 'line-join':'round' },
    paint:{ 'line-color':'#7fd4f0', 'line-width':2.2, 'line-opacity':0.85 } });
}

function addDrainageLayers(){
  if(!map || drainageActive) return;
  map.addSource('rainDots', { type:'geojson', data:{type:'FeatureCollection', features:[]} });
  map.addLayer({ id:'rainDotsLayer', type:'circle', source:'rainDots',
    paint:{ 'circle-radius':2.2, 'circle-color':'#8ff5ea', 'circle-opacity':0.85 } });
  landslideMarkers = LANDSLIDE_POINTS_PANAJACHEL.map(p=>{
    const el = document.createElement('div');
    el.style.width='16px'; el.style.height='16px'; el.style.borderRadius='4px';
    el.style.background = '#c1443b'; el.style.border='2px solid #fff';
    el.style.opacity='0'; el.style.transition='opacity .5s, transform .5s'; el.style.transform='scale(0.7)';
    el.title = p.label;
    const m = new maplibregl.Marker({element:el}).setLngLat(p.coord).addTo(map);
    return { marker:m, el };
  });
  riverLandmarkMarkers = RIVER_LANDMARKS_PANAJACHEL.map(p=>{
    const el = document.createElement('div');
    el.style.width='13px'; el.style.height='13px'; el.style.borderRadius='50%';
    el.style.background = '#d8a84e'; el.style.border='2px solid #10201a';
    el.style.boxShadow = '0 0 0 2px #d8a84e88'; el.style.cursor='help';
    el.title = p.label;
    const m = new maplibregl.Marker({element:el}).setLngLat(p.coord).addTo(map);
    return { marker:m, el };
  });
  // Partículas que fluyen río abajo siguiendo el cauce real (simulación de movimiento del agua)
  riverLineForFlow = turf.lineString(RIVER_MAIN_PANAJACHEL);
  riverLengthKm = turf.length(riverLineForFlow, { units:'kilometers' });
  flowParticles = Array.from({length:16}, (_,i)=> (i/16)*riverLengthKm);
  map.addSource('flowDots', { type:'geojson', data:{type:'FeatureCollection', features:[]} });
  map.addLayer({ id:'flowDotsLayer', type:'circle', source:'flowDots',
    paint:{ 'circle-radius':3.6, 'circle-color':'#eafffb', 'circle-opacity':0.95, 'circle-stroke-width':1.2, 'circle-stroke-color':'#3f9fc4' } });
  drainageActive = true;
  rainDotsTimer = setInterval(spawnRainDots, 850);
  flowTimer = setInterval(advanceFlow, 150);
}
function advanceFlow(){
  if(!map || !map.getSource('flowDots') || !localState || !riverLineForFlow || riverLengthKm<=0) return;
  const mm = localState.rainMm;
  const speedKm = 0.006 + mm*0.00055; // caudal bajo → flujo lento; tormenta → flujo rápido y visible
  const features = flowParticles.map((d,i)=>{
    let nd = d - speedKm; // la distancia 0 está en la desembocadura: restar avanza río abajo, hacia el lago
    if(nd < 0) nd += riverLengthKm;
    flowParticles[i] = nd;
    return turf.along(riverLineForFlow, nd, { units:'kilometers' });
  });
  map.getSource('flowDots').setData({ type:'FeatureCollection', features });
}
function removeDrainageLayers(){
  if(!map || !drainageActive) return;
  if(rainDotsTimer){ clearInterval(rainDotsTimer); rainDotsTimer=null; }
  if(flowTimer){ clearInterval(flowTimer); flowTimer=null; }
  landslideMarkers.forEach(lm=>lm.marker.remove());
  landslideMarkers = [];
  riverLandmarkMarkers.forEach(lm=>lm.marker.remove());
  riverLandmarkMarkers = [];
  if(map.getLayer('rainDotsLayer')) map.removeLayer('rainDotsLayer');
  if(map.getSource('rainDots')) map.removeSource('rainDots');
  if(map.getLayer('flowDotsLayer')) map.removeLayer('flowDotsLayer');
  if(map.getSource('flowDots')) map.removeSource('flowDots');
  drainageActive = false;
}
function spawnRainDots(){
  if(!map || !map.getSource('rainDots') || !localState) return;
  const mm = localState.rainMm;
  const count = Math.round(mm*1.4);
  const bounds = { minLng:-91.172, maxLng:-91.145, minLat:14.743, maxLat:14.762 }; // ladera alta sobre Panajachel
  const features = [];
  for(let i=0;i<count;i++){
    const lng = bounds.minLng + Math.random()*(bounds.maxLng-bounds.minLng);
    const lat = bounds.minLat + Math.random()*(bounds.maxLat-bounds.minLat);
    features.push({ type:'Feature', geometry:{type:'Point', coordinates:[lng,lat]}, properties:{} });
  }
  map.getSource('rainDots').setData({ type:'FeatureCollection', features });
}
function updateDrainageVisuals(s, r){
  if(!drainageActive || !map) return;
  const showSlides = r.landslideRisk > 55;
  landslideMarkers.forEach(lm=>{
    lm.el.style.opacity = showSlides ? '1' : '0';
    lm.el.style.transform = showSlides ? 'scale(1)' : 'scale(0.7)';
  });
}

/* =========================================================
   LLUVIA ANIMADA
========================================================= */
let canvas, ctx, drops = [];
function initRainCanvas(){
  canvas = document.getElementById('rainCanvas');
  ctx = canvas.getContext('2d');
  const resize = ()=>{ canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
  window.addEventListener('resize', resize); resize();
  requestAnimationFrame(rainLoop);
}
function spawnDrop(){ return { x:Math.random()*canvas.width, y:Math.random()*-canvas.height, len:14+Math.random()*18, speed:9+Math.random()*7 }; }
function rainLoop(){
  if(canvas){
    const mm = localState ? localState.rainMm : 0;
    const targetCount = Math.round(mm*2.2);
    while(drops.length < targetCount) drops.push(spawnDrop());
    if(drops.length > targetCount) drops.length = targetCount;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    if(targetCount>0){
      ctx.strokeStyle='rgba(170,210,230,0.42)'; ctx.lineWidth=1.3;
      drops.forEach(d=>{ ctx.beginPath(); ctx.moveTo(d.x,d.y); ctx.lineTo(d.x-4,d.y+d.len); ctx.stroke();
        d.y += d.speed; d.x -= 1.6; if(d.y>canvas.height){ d.y=-20; d.x=Math.random()*canvas.width; } });
    }
  }
  requestAnimationFrame(rainLoop);
}

        <div class="place-btn" id="eventsBtn" style="width:100%;" onclick="openHistoricalEvents()">📅 Simular un evento histórico real</div>
      </div>
      <div id="wallsRow" style="margin-top:10px;">
        <div class="place-btn" id="wallsBtn" onclick="toggleWalls()">🧱 Sin muros de mitigación</div>
        <div class="impact-note" style="margin-top:4px;">Compará el escenario actual con la medida que recomienda el estudio real: muros de encauzamiento diseñados para la avenida de 100 años. Reducen la inundación, no los deslizamientos.</div>
      </div>
      <div class="place-btn" id="demoBtn" style="margin-top:10px;width:100%;" onclick="playDemo()">▶ Ejemplo automático</div>
    </div>
    <div id="modalRoot"></div>
    <div class="attrib">Satélite: Esri World Imagery · Relieve: AWS Terrain Tiles · Hidrografía: capa oficial IGN/MAGA</div>
  `;
  initRainCanvas();
  initMap();
}

function rainButtonsHTML(s){
  const opts = [[0,'sin lluvia'],[10,'ligera'],[30,'T≈5 años'],[40,'fuerte'],[50,'T≈25 años'],[70,'T≈100 años']];
  return opts.map(([mm,tag])=>`<div class="rain-btn ${s.rainMm===mm?'active':''}" onclick="setRain(${mm})"><span class="mm">${mm}mm</span><span class="tag">${tag}</span></div>`).join('');
}
function setRain(mm){ if(demoPlaying) return; localState.rainMm = mm; renderSim(); }
function toggleWalls(){ if(demoPlaying) return; localState.wallsBuilt = !localState.wallsBuilt; renderSim(); }
function setPlace(p){
  if(demoPlaying) return;
  localState.place = p;
  document.getElementById('placeBtnPana').classList.toggle('active', p==='panajachel');
  document.getElementById('placeBtnSM').classList.toggle('active', p==='sanmarcos');
  if(map){
    const place = PLACES[p];
    map.flyTo({center:place.center, zoom:place.zoom, pitch:place.pitch, bearing:place.bearing, duration:1800});
    addRealRivers(p);
    if(map.getSource('floodZone')) map.getSource('floodZone').setData(floodLineData(p));
    if(p==='panajachel') addDrainageLayers(); else removeDrainageLayers();
  }
  renderSim();
}
function renderSim(){
  const r = computeRisk(localState);
  const place = PLACES[localState.place];
  const impact = computeImpact(Math.max(r.floodRisk, r.landslideRisk), place);
  document.getElementById('placeTag').textContent = '📍 ' + place.label;
  document.getElementById('rainBadge').innerHTML = `🌧️ ${localState.rainMm}mm <span style="font-size:11px;color:var(--muted);font-weight:500;">(${rainLabel(localState.rainMm)})</span>`;
  document.getElementById('floodValTxt').textContent = Math.round(r.floodRisk)+'%';
  document.getElementById('floodFill').style.width = r.floodRisk+'%';
  document.getElementById('floodFill').style.background = riskColor(r.floodRisk);
  document.getElementById('slideValTxt').textContent = Math.round(r.landslideRisk)+'%';
  document.getElementById('slideFill').style.width = r.landslideRisk+'%';
  document.getElementById('slideFill').style.background = riskColor(r.landslideRisk);
  document.getElementById('housesTxt').textContent = impact.houses.toLocaleString('es');
  document.getElementById('peopleTxt').textContent = impact.people.toLocaleString('es');
  document.getElementById('popSourceNote').innerHTML = `📖 Población base (${place.people.toLocaleString('es')} hab.): ${place.popSource}. El % afectado es una proyección ilustrativa según el riesgo, no un censo de daños real.`;
  const caudalNote = document.getElementById('caudalNote');
  const wallsRow = document.getElementById('wallsRow');
  const wallsBtn = document.getElementById('wallsBtn');
  if(localState.place==='panajachel'){
    const q = estimateCaudal(localState.rainMm);
    const v = estimateVelocity(localState.rainMm);
    caudalNote.innerHTML = `🌊 Caudal estimado: <b style="color:var(--amber)">${q.toLocaleString('es')} m³/s</b> · velocidad media: <b style="color:var(--amber)">${v} m/s</b> ${localState.wallsBuilt?'<span style="color:var(--good)">(con muros)</span>':''} — referencia: estudio hidrológico real (Geólogos del Mundo / CONRED, 2012).`;
    wallsRow.style.display = 'block';
    wallsBtn.textContent = localState.wallsBuilt ? '🧱 Con muros de mitigación (activo)' : '🧱 Sin muros de mitigación';
    wallsBtn.classList.toggle('active', localState.wallsBuilt);
  } else {
    caudalNote.innerHTML = '';
    wallsRow.style.display = 'none';
  }
  const activeEvent = currentHistoricalEvent(localState.rainMm);
  const eventsRow = document.getElementById('eventsRow');
  if(eventsRow) eventsRow.style.display = localState.place==='panajachel' ? 'block' : 'none';
  const narrativeBox = document.getElementById('narrativeBox');
  if(activeEvent){
    narrativeBox.innerHTML = `<b style="color:var(--amber);">📅 Simulando: ${activeEvent.name} (${activeEvent.year})</b> — lluvia real medida: ${activeEvent.realMm}, ${activeEvent.T}.<br>${narrativeText(localState, r)}`;
  } else {
    narrativeBox.textContent = narrativeText(localState, r);
  }
  document.getElementById('rainGrid').innerHTML = rainButtonsHTML(localState);
  const dark = Math.min(0.5, localState.rainMm/100*0.5);
  document.getElementById('weatherOverlay').style.background = `rgba(10,16,12,${dark})`;
  if(map && map.isStyleLoaded && map.isStyleLoaded()) updateFloodZone(localState);
  else if(map) map.once('idle', ()=>updateFloodZone(localState));
  updateDrainageVisuals(localState, r);
  setRainVolume(localState.rainMm);
  if(r.floodRisk>65 || r.landslideRisk>65) startAlarm(); else stopAlarm();
}

async function playDemo(){
  if(demoPlaying) return;
  demoPlaying = true;
  const btn = document.getElementById('demoBtn');
  const sequence = [
    {mm:0,   note:"Antes de la tormenta: el río San Francisco corre tranquilo hacia el lago."},
    {mm:10,  note:"Empieza a llover. Todavía nada fuera de lo común para la temporada."},
    {mm:30,  note:"Lluvia moderada. El caudal del río empieza a subir notablemente."},
    {mm:50,  note:"Lluvia muy fuerte. El agua ya corre con fuerza por el cauce urbano."},
    {mm:70,  note:"Escenario Ágata (269mm en 2 días, mayo de 2010): el río se desborda sobre el abanico aluvial donde está construido el pueblo."},
  ];
  for(const step of sequence){
    if(btn) btn.textContent = '⏸ Reproduciendo…';
    localState.rainMm = step.mm;
    renderSim();
    document.getElementById('narrativeBox').textContent = step.note;
    await new Promise(res=>setTimeout(res, 4200));
  }
  demoPlaying = false;
  if(btn) btn.textContent = '▶ Ejemplo automático';
}

/* =========================================================
   MODO MISIÓN — evacuación a tiempo
========================================================= */
const MISSION_RAMP = [0,3,6,10,15,20,26,33,40,48,56,64,70,78,85,92,100];
let missionTick = null, missionStep = 0, missionEvacRain = null, missionEnded = false;

function startMission(){
  if(tlAutoTimer){ clearInterval(tlAutoTimer); tlAutoTimer=null; }
  if(map){ try{ map.remove(); }catch(e){} map=null; }
  if(flowTimer){ clearInterval(flowTimer); flowTimer=null; }
  if(rainDotsTimer){ clearInterval(rainDotsTimer); rainDotsTimer=null; }
  if(missionTick){ clearInterval(missionTick); missionTick=null; }
  drainageActive = false;
  initAudio();
  document.body.style.overflow = 'hidden';
  localState = defaultState();
  missionStep = 0; missionEvacRain = null; missionEnded = false;
  document.getElementById('app').className = '';
  document.getElementById('app').innerHTML = `
    <div id="map"></div>
    <canvas id="rainCanvas"></canvas>
    <div id="weatherOverlay"></div>
    <div id="flashOverlay"></div>
    <div class="back-btn" style="top:88px;" onclick="goHome()">↩ salir</div>
    <div class="mission-topbar">
      <div>
        <div class="eyebrow">🎯 Modo misión — Panajachel</div>
        <div class="place-tag">Tormenta Ágata, mayo de 2010</div>
      </div>
      <div style="text-align:right;">
        <div class="mission-clock" id="missionRain">0mm</div>
        <div class="mute-btn" id="muteBtn" onclick="toggleSound()" style="margin-top:6px;">🔊 Sonido</div>
      </div>
    </div>
    <div class="side-panel" style="top:110px;">
      <div class="lbl">Riesgo en la zona baja</div>
      <div class="risk-item">
        <div class="risk-top"><span>🌊 Inundación</span><span class="risk-val" id="floodValTxt">0%</span></div>
        <div class="risk-track"><div class="risk-fill" id="floodFill" style="width:0%;background:var(--good)"></div></div>
      </div>
      <div class="risk-item">
        <div class="risk-top"><span>⛰️ Deslizamientos</span><span class="risk-val" id="slideValTxt">0%</span></div>
        <div class="risk-track"><div class="risk-fill" id="slideFill" style="width:0%;background:var(--good)"></div></div>
      </div>
      <div class="impact-row">
        <div class="impact-item"><div class="n" id="housesTxt">0</div><div class="l">viviendas en riesgo</div></div>
        <div class="impact-item"><div class="n" id="peopleTxt">0</div><div class="l">personas en riesgo</div></div>
      </div>
      <div class="impact-note" id="caudalNote"></div>
      <div class="impact-note">📖 Base: 7,183 hab. — INE, censo 2002, población de Panajachel amenazada por el río San Francisco (citada en el estudio hidrológico 2012).</div>
      <div class="narrative-box" id="narrativeBox">La tormenta recién empieza. Vos decidís cuándo ordenar la evacuación.</div>
    </div>
    <div class="evac-panel">
      <button class="evac-btn" id="evacBtn" onclick="triggerEvacuation()">🚨 ORDENAR EVACUACIÓN</button>
      <div class="mission-hint">Muy pronto: falsa alarma. Muy tarde: gente atrapada. Encontrá el momento justo.</div>
    </div>
    <div class="attrib">Satélite: Esri World Imagery · Relieve: AWS Terrain Tiles · Hidrografía: capa oficial IGN/MAGA</div>
  `;
  initRainCanvas();
  initMissionMap();
}

function initMissionMap(){
  const place = PLACES['panajachel'];
  map = new maplibregl.Map({
    container:'map',
    style:{
      version:8,
      sources:{
        satellite:{ type:'raster', tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'], tileSize:256, attribution:'Tiles © Esri' },
        terrainSource:{ type:'raster-dem', tiles:['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'], tileSize:256, encoding:'terrarium' }
      },
      layers:[ {id:'satellite-layer', type:'raster', source:'satellite'} ],
      terrain:{ source:'terrainSource', exaggeration:1.4 }
    },
    center:place.center, zoom:place.zoom, pitch:place.pitch, bearing:place.bearing,
    antialias:true, maxPitch:80
  });
  map.on('load', ()=>{
    try{ map.addLayer({id:'sky', type:'sky', paint:{'sky-type':'atmosphere','sky-atmosphere-sun-intensity':10}}); }catch(e){}
    map.addSource('floodZone', { type:'geojson', data: floodLineData(localState.place) });
    map.addLayer({ id:'floodLineLayer', type:'line', source:'floodZone',
      layout:{ 'line-cap':'round', 'line-join':'round' },
      paint:{ 'line-color':'#1f8fe0', 'line-width':0, 'line-opacity':0, 'line-blur':0.4 } });
    addRealRivers('panajachel');
    addDrainageLayers();
    renderMissionTick();
    missionTick = setInterval(missionAdvance, 2400);
  });
}

function missionAdvance(){
  if(missionEnded) return;
  missionStep++;
  if(missionStep >= MISSION_RAMP.length){
    clearInterval(missionTick);
    endMission(null); // nunca evacuó
    return;
  }
  localState.rainMm = MISSION_RAMP[missionStep];
  renderMissionTick();
}
function renderMissionTick(){
  const r = computeRisk(localState);
  const place = PLACES['panajachel'];
  const impact = computeImpact(Math.max(r.floodRisk, r.landslideRisk), place);
  document.getElementById('missionRain').innerHTML = `${localState.rainMm}mm <span style="font-size:12px;color:var(--muted);font-weight:500;">(${rainLabel(localState.rainMm)})</span>`;
  document.getElementById('floodValTxt').textContent = Math.round(r.floodRisk)+'%';
  document.getElementById('floodFill').style.width = r.floodRisk+'%';
  document.getElementById('floodFill').style.background = riskColor(r.floodRisk);
  document.getElementById('slideValTxt').textContent = Math.round(r.landslideRisk)+'%';
  document.getElementById('slideFill').style.width = r.landslideRisk+'%';
  document.getElementById('slideFill').style.background = riskColor(r.landslideRisk);
  document.getElementById('housesTxt').textContent = impact.houses.toLocaleString('es');
  document.getElementById('peopleTxt').textContent = impact.people.toLocaleString('es');
  const q = estimateCaudal(localState.rainMm);
  document.getElementById('caudalNote').innerHTML = `🌊 Caudal estimado: <b style="color:var(--amber)">${q.toLocaleString('es')} m³/s</b> (referencia: estudio hidrológico real, 2012)`;
  document.getElementById('narrativeBox').textContent = narrativeText(localState, r);
  const dark = Math.min(0.5, localState.rainMm/100*0.5);
  document.getElementById('weatherOverlay').style.background = `rgba(10,16,12,${dark})`;
  if(map && map.isStyleLoaded && map.isStyleLoaded()) updateFloodZone(localState);
  else if(map) map.once('idle', ()=>updateFloodZone(localState));
  updateDrainageVisuals(localState, r);
  setRainVolume(localState.rainMm);
  if(r.floodRisk>65 || r.landslideRisk>65) startAlarm(); else stopAlarm();
}

function triggerEvacuation(){
  if(missionEnded) return;
  missionEvacRain = localState.rainMm;
  clearInterval(missionTick);
  endMission(missionEvacRain);
}

function endMission(evacRain){
  missionEnded = true;
  stopAlarm();
  const place = PLACES['panajachel'];
  const r = evacRain===null ? computeRisk({rainMm:100, place:'panajachel'}) : computeRisk({rainMm:evacRain, place:'panajachel'});
  const floodRisk = r.floodRisk;
  let label, color, pct, feedback;

  if(evacRain===null){
    label='SIN EVACUACIÓN'; color='var(--danger)'; pct=0.05;
    feedback = "La lluvia llegó a niveles de tormenta Ágata y nunca se ordenó la evacuación. Sin aviso previo, la mayoría de la población quedó atrapada por la crecida repentina.";
  } else if(floodRisk < 15){
    label='ALERTA PREMATURA'; color='var(--amber)'; pct=0.90;
    feedback = "Evacuaste con apenas "+evacRain+"mm de lluvia. Se salvó casi todo el mundo, pero una alarma tan temprana —antes de que hubiera señales claras— puede hacer que la próxima vez la gente no te crea (fatiga de alertas).";
  } else if(floodRisk <= 55){
    label='EVACUACIÓN OPORTUNA'; color='var(--good)'; pct=0.97;
    feedback = "Excelente decisión: evacuaste con "+evacRain+"mm, cuando el riesgo ya era claro pero el agua todavía no había llegado a las casas. Es exactamente la ventana que buscan los sistemas de alerta temprana reales.";
  } else if(floodRisk <= 75){
    label='EVACUACIÓN TARDÍA'; color='var(--amber)'; pct=0.55;
    feedback = "Ordenaste evacuar con "+evacRain+"mm, cuando el agua ya estaba subiendo con fuerza. Se salvó una parte de la población, pero muchas familias ya no tuvieron tiempo de salir a tiempo.";
  } else {
    label='EVACUACIÓN DEMASIADO TARDE'; color='var(--danger)'; pct=0.20;
    feedback = "Con "+evacRain+"mm el escenario ya era el de la tormenta Ágata real: la crecida llegó antes que la orden de evacuar. Muy pocas familias lograron ponerse a salvo a tiempo.";
  }

  const peopleSaved = Math.round(place.people * pct);
  const isNewBest = !bestMissionScore || peopleSaved > bestMissionScore.peopleSaved;
  if(isNewBest){
    bestMissionScore = { peopleSaved, total: place.people, pct: Math.round(pct*100), label };
  }
  document.getElementById('app').insertAdjacentHTML('beforeend', `
    <div class="result-overlay">
      <div class="result-card">
        <div class="result-badge" style="background:${color}22;color:${color};border:1px solid ${color}55">${label}</div>
        <h2>Resultado de la misión</h2>
        <div class="result-num" style="color:${color}">${peopleSaved.toLocaleString('es')}</div>
        <div class="result-sub">de ${place.people.toLocaleString('es')} personas puestas a salvo (${Math.round(pct*100)}%)</div>
        ${isNewBest ? `<div class="hist-box" style="border-left-color:var(--forest);margin-bottom:14px;">🏆 ¡Nuevo mejor intento de la sesión!</div>` : `<div class="impact-note" style="margin-bottom:14px;">Mejor intento de la sesión: ${bestMissionScore.peopleSaved.toLocaleString('es')} personas (${bestMissionScore.pct}%).</div>`}
        <div class="result-text">${feedback}</div>
        <button class="start-btn" onclick="startMission()">🔁 Reintentar misión</button>
        <button class="start-btn secondary" style="margin-top:8px;" onclick="goHome()">↩ Volver al inicio</button>
      </div>
    </div>
  `);
}

/* =========================================================
   MAPA 3D REAL (simulación libre)
========================================================= */
function initMap(){
  const place = PLACES[localState.place];
  map = new maplibregl.Map({
    container:'map',
    style:{
      version:8,
      sources:{
        satellite:{ type:'raster', tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'], tileSize:256, attribution:'Tiles © Esri' },
        terrainSource:{ type:'raster-dem', tiles:['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'], tileSize:256, encoding:'terrarium' }
      },
      layers:[ {id:'satellite-layer', type:'raster', source:'satellite'} ],
      terrain:{ source:'terrainSource', exaggeration:1.4 }
    },
    center:place.center, zoom:place.zoom, pitch:place.pitch, bearing:place.bearing,
    antialias:true, maxPitch:80
  });
  map.addControl(new maplibregl.NavigationControl({visualizePitch:true}), 'top-right');
  map.on('load', ()=>{
    try{ map.addLayer({id:'sky', type:'sky', paint:{'sky-type':'atmosphere','sky-atmosphere-sun-intensity':10}}); }catch(e){}
    map.addSource('floodZone', { type:'geojson', data: floodLineData(localState.place) });
    map.addLayer({ id:'floodLineLayer', type:'line', source:'floodZone',
      layout:{ 'line-cap':'round', 'line-join':'round' },
      paint:{ 'line-color':'#1f8fe0', 'line-width':0, 'line-opacity':0, 'line-blur':0.4 } });
    addRealRivers(localState.place);
    if(localState.place==='panajachel') addDrainageLayers();
    renderSim();
  });
}

/* INIT */
renderHome();
</script>
